services:
  postgres:
    image: postgres:16-alpine
    container_name: raraverse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ebieshop
      POSTGRES_PASSWORD: ebieshop_dev_password
      POSTGRES_DB: ebieshop
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ebieshop -d ebieshop']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: raraverse-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: raraverse-backend-dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.development
    environment:
      NODE_ENV: development
      PORT: '3001'
      DATABASE_URL: postgresql://ebieshop:ebieshop_dev_password@postgres:5432/ebieshop
      REDIS_URL: redis://redis:6379
      SKIP_QUEUE_CONNECTION: 'false'
      CHOKIDAR_USEPOLLING: 'true'
    ports:
      - '127.0.0.1:3001:3001'
    volumes:
      - .:/app
      - /app/node_modules
      - /app/packages/shared/node_modules
      - /app/packages/db/node_modules
      - /app/packages/mocks/node_modules
      - /app/apps/backend/node_modules

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend.dev
    container_name: raraverse-frontend-dev
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: development
      INTERNAL_API_URL: http://backend:3001
      NEXT_PUBLIC_API_URL: http://127.0.0.1:3001
      WATCHPACK_POLLING: 'true'
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - .:/app
      - /app/node_modules
      - /app/packages/shared/node_modules
      - /app/apps/frontend/node_modules
      - /app/apps/frontend/.next

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: raraverse-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  redisdata:
  miniodata:
